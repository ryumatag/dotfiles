name: dotlink ci

on:
  push:
  pull_request:

jobs:
  dotlink:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        work_overlay: [false, true]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Prepare fake HOME
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/_home/.config"
          mkdir -p "$GITHUB_WORKSPACE/_home/.local/bin"
          mkdir -p "$GITHUB_WORKSPACE/_workdotfiles"

      - name: Prepare work overlay fixture (only when enabled)
        if: ${{ matrix.work_overlay == true }}
        shell: bash
        env:
          HOME: ${{ github.workspace }}/_home
          XDG_CONFIG_HOME: ${{ github.workspace }}/_home/.config
          WORK_DOTFILES_ROOT: ${{ github.workspace }}/_workdotfiles
        run: |
          set -euxo pipefail

          # Enable "work machine" detection for bin/is-work (current policy: marker file).
          mkdir -p "$XDG_CONFIG_HOME/dotfiles"
          touch "$XDG_CONFIG_HOME/dotfiles/is-work"

          # Create minimal work dotfiles structure (same layout as the personal repo).
          # Override git for both base and darwin to test priority ordering.
          mkdir -p "$WORK_DOTFILES_ROOT/.config/git"
          echo "work-overlay-base" > "$WORK_DOTFILES_ROOT/.config/git/CI_WORK_OVERLAY_MARKER"

          mkdir -p "$WORK_DOTFILES_ROOT/darwin/.config/git"
          echo "work-overlay-darwin" > "$WORK_DOTFILES_ROOT/darwin/.config/git/CI_WORK_OVERLAY_DARWIN_MARKER"

      - name: dotlink link/status/unlink/prune (repo path)
        shell: bash
        env:
          HOME: ${{ github.workspace }}/_home
          XDG_CONFIG_HOME: ${{ github.workspace }}/_home/.config
          LOCAL_BIN: ${{ github.workspace }}/_home/.local/bin
          WORK_DOTFILES_ROOT: ${{ github.workspace }}/_workdotfiles
        run: |
          set -euxo pipefail

          # Link via repo-local dotlink.
          ./bin/dotlink link

          # Basic expectations.
          test -L "$XDG_CONFIG_HOME/zsh"
          test -L "$XDG_CONFIG_HOME/nvim"
          test -L "$HOME/.zshenv"

          # Overlay assertions.
          if [ "${{ matrix.work_overlay }}" = "true" ]; then
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              exp="$WORK_DOTFILES_ROOT/darwin/.config/git"
              marker="CI_WORK_OVERLAY_DARWIN_MARKER"
            else
              exp="$WORK_DOTFILES_ROOT/.config/git"
              marker="CI_WORK_OVERLAY_MARKER"
            fi

            got=$(readlink "$XDG_CONFIG_HOME/git")
            test "$got" = "$exp"
            test -f "$XDG_CONFIG_HOME/git/$marker"
          else
            # When overlay is off, git should point to the personal repo.
            if [ "${{ matrix.os }}" = "macos-latest" ] && [ -d "$(pwd)/darwin/.config/git" ]; then
              exp="$(pwd)/darwin/.config/git"
            else
              exp="$(pwd)/.config/git"
            fi
            got=$(readlink "$XDG_CONFIG_HOME/git")
            test "$got" = "$exp"
          fi

          # macOS-only configs should only link on macOS runners.
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            test -L "$XDG_CONFIG_HOME/hammerspoon"
            test -L "$XDG_CONFIG_HOME/karabiner"
            test -L "$XDG_CONFIG_HOME/yabai"
            test -L "$LOCAL_BIN/install-mozc-macos"
          else
            test ! -e "$XDG_CONFIG_HOME/hammerspoon"
            test ! -e "$XDG_CONFIG_HOME/karabiner"
            test ! -e "$XDG_CONFIG_HOME/yabai"
            test ! -e "$LOCAL_BIN/install-mozc-macos"
          fi

          # Status should succeed.
          ./bin/dotlink status

          # Unlink then status should fail (expected).
          ./bin/dotlink unlink
          if ./bin/dotlink status; then
            echo "status unexpectedly succeeded after unlink"
            exit 1
          fi

          # Create a broken symlink pointing to darwin config and ensure prune removes it.
          ln -s "$(pwd)/darwin/.config/does-not-exist" "$XDG_CONFIG_HOME/should-prune"
          test -L "$XDG_CONFIG_HOME/should-prune"
          ./bin/dotlink prune
          test ! -e "$XDG_CONFIG_HOME/should-prune"

          # Prune should not error even if nothing to prune.
          ./bin/dotlink prune

      - name: dotlink via symlink in LOCAL_BIN (regression for symlink loops)
        shell: bash
        env:
          HOME: ${{ github.workspace }}/_home
          XDG_CONFIG_HOME: ${{ github.workspace }}/_home/.config
          LOCAL_BIN: ${{ github.workspace }}/_home/.local/bin
          WORK_DOTFILES_ROOT: ${{ github.workspace }}/_workdotfiles
        run: |
          set -euxo pipefail

          # Re-link to recreate ~/.local/bin/dotlink.
          ./bin/dotlink link

          # Run dotlink through the symlinked command path.
          "$LOCAL_BIN/dotlink" status
          "$LOCAL_BIN/dotlink" prune
          "$LOCAL_BIN/dotlink" unlink
